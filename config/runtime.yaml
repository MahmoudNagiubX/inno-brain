app_name: InnoBrain
environment: development
primary_locale: ar-EG
secondary_locale: en
development_platform: laptop

audio:
  backend: sounddevice
  input_device: null
  output_device: null
  target_sample_rate_hz: 16000
  channels: 1
  frame_ms: 20
  software_aec_enabled: false
  software_ns_enabled: false

realtime:
  audio_queue_max_chunks: 100

  vad:
    confidence: 0.7
    start_secs: 0.2
    stop_secs: 0.2
    min_volume: 0.6

  smart_turn:
    enabled: true
    wait_for_transcript: false
    cpu_count: 1

  mock_think_delay_ms: 150
  mock_response_tone_hz: 440.0
  mock_response_duration_secs: 6.0
  mock_response_volume: 0.08

conversation:
  memory_max_turns: 10
  memory_ttl_seconds: 300

events:
  data_root: runtime_data
  require_signature_in_production: true
  allow_unsigned_development: false
  allow_remote_package_fetch: false
  allowed_remote_hosts: []
  max_archive_bytes: 536870912
  max_file_count: 2000
  max_uncompressed_bytes: 1073741824
  max_single_file_bytes: 268435456
