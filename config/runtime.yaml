app_name: InnoBrain
environment: development
primary_locale: ar-EG
secondary_locale: en
development_platform: laptop

audio:
  backend: sounddevice
  # Resolve the live PortAudio index from these properties at runtime. Never
  # persist a Windows device index; the S330 is the development mic and speaker.
  input_device:
    name_pattern: "Anker PowerConf S330"
    host_api: "MME"
    direction: capture
    channels: 1
    sample_rate_hz: 16000
    sample_format: int16
  output_device:
    name_pattern: "Anker PowerConf S330"
    host_api: "MME"
    direction: playback
    channels: 1
    sample_rate_hz: 16000
    sample_format: int16
  target_sample_rate_hz: 16000
  channels: 1
  frame_ms: 20
  software_aec_enabled: false
  software_ns_enabled: false

realtime:
  audio_queue_max_chunks: 100

  vad:
    confidence: 0.7
    start_secs: 0.2
    stop_secs: 0.2
    min_volume: 0.6

  smart_turn:
    enabled: true
    wait_for_transcript: false
    cpu_count: 1

  mock_think_delay_ms: 150
  mock_response_tone_hz: 440.0
  mock_response_duration_secs: 6.0
  mock_response_volume: 0.08

conversation:
  memory_max_turns: 10
  memory_ttl_seconds: 300

events:
  data_root: runtime_data
  require_signature_in_production: true
  allow_unsigned_development: false
  allow_remote_package_fetch: false
  allowed_remote_hosts: []
  max_archive_bytes: 536870912
  max_file_count: 2000
  max_uncompressed_bytes: 1073741824
  max_single_file_bytes: 268435456

wake_word:
  enabled: true
  operating_mode: development_bypass
  phrase: "Heyino/H-E-Y-I-N-N-O"
  canonical_label: heyino
  engine_type: openwakeword
  model_path: null
  threshold: 0.5
  cooldown_seconds: 1.5
  preroll_ms: 1500
  candidate_engines:
    openwakeword:
      model_path: "models/wake/heyino_openwakeword_v0.onnx"
      frame_length_samples: 1280
      threshold: 0.5
    porcupine:
      model_path: "models/wake/heyino_porcupine.ppn"
      frame_length_samples: 512
      threshold: 0.5

attention:
  followup_window_ms: 4500.0
  followup_window_cap_ms: 8000.0
  max_session_duration_seconds: 120.0
  rejected_background_limit: 1
  wake_cooldown_seconds: 1.5
