[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "innobrain"
version = "0.1.0"
description = "Egyptian-Arabic-first AI and voice brain for the Innovatronics event robot."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "azure-cognitiveservices-speech==1.51.2",
    "cryptography==50.0.1",
    "deepgram-sdk>=6.1.1,<8",
    "huggingface-hub>=0.34,<1",
    "numpy>=2.0,<3",
    "onnxruntime==1.24.3",
    "openai>=1.74,<3",
    "pipecat-ai==1.8.1",
    "pydantic>=2.13,<3",
    "PyYAML>=6,<7",
    "sounddevice>=0.5,<1",
    "speechmatics-voice==0.2.8",
    "sqlite-vec==0.1.9",
    "tokenizers>=0.21,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]
event-builder = [
    "docling==2.124.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
